<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Reader</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-line,
    .bottom-line {
      width: 100%;
      height: 1px;
      background-color: #fff;
      opacity: 0.4;
      position: absolute;
    }

    .top-line {
      top: 140px;
    }

    .bottom-line {
      top: 340px;
    }

    .vertical-line {
      width: 2px;
      opacity: 0.4;
      height: 200px;
      background-color: #fff;
      position: absolute;
      left: 50%;
      top: 140px;
      transform: translateX(-50%);
    }

 .word-display {
  position: absolute;
  top: 210px;
  left: 50%;
  font-size: 64px;
  color: #fff;
  white-space: nowrap;
  line-height: 1;
}

    .word-display .red {
      color: #ff0000;
    }

    .controls {
      position: absolute;
      bottom: 60px;
      right: 60px;
      background-color: #fff;
      padding: 20px;
      width: 350px;
    }

    .controls.hidden {
      display: none;
    }

    .input-area {
      width: 100%;
      min-height: 80px;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      border: 1px solid #ccc;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    .speed-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .speed-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .speed-btn {
      width: 30px;
      height: 30px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speed-btn:hover {
      background-color: #333;
    }

    .speed-value {
      min-width: 30px;
      text-align: center;
      font-weight: bold;
    }

    .start-btn {
      width: 100%;
      padding: 12px;
      background-color: #000;
      color: #fff;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    .start-btn:hover {
      background-color: #333;
    }

 .speed-indicator {
  position: absolute;
  top: 355px; /* slightly below bottom horizontal line */
  left: 90%;
  transform: translateX(-50%);
  color: #fff;
  font-size: 16px;
  opacity: 0.35;
  font-style: italic;
  letter-spacing: 1px;
  pointer-events: none;
}



    /* top segment */
.vertical-line.top {
  top: 140px;
  height: 60px;
}

/* bottom segment */
.vertical-line.bottom {
  top: 290px;
  height: 50px;
}


@media (max-width: 480px) {
  .word-display {
    font-size: 49px;
  }

    .controls {
      position: absolute;
      bottom: 30px;
      right: 60px;
      background-color: #fff;
      padding: 8px;
      width: 300px;
    }

    .vertical-line.top {
  top: 140px;
  height: 50px;
}

/* bottom segment */
.vertical-line.bottom {
  top: 300px;
  height: 40px;
}

}





  </style>
</head>

<body>
  <div class="top-line"></div>
<div class="vertical-line top"></div>
<div class="vertical-line bottom"></div>

  <div class="bottom-line"></div>

  <div class="word-display" id="wordDisplay"></div>
  <div class="speed-indicator" id="speedIndicator">300 wpm</div>


  <div class="controls" id="controls">
    <textarea
      class="input-area"
      id="textInput"
      placeholder="The quick brown fox jumped over a big fence"
    >The quick brown fox jumped over a big fence</textarea>

    <div class="speed-control">
      <div class="speed-buttons">
        <button class="speed-btn" id="decreaseSpeed">-</button>
        <span class="speed-value" id="speedValue">control</span>
        <button class="speed-btn" id="increaseSpeed">+</button>
      </div>

      <button class="start-btn" id="startBtn">Start</button>
    </div>
  </div>

  <script>
  let speed = 300; // words per minute
  let words = [];
  let currentIndex = 0;
  let intervalId = null;

  const textInput = document.getElementById("textInput");
  const startBtn = document.getElementById("startBtn");
  const decreaseSpeed = document.getElementById("decreaseSpeed");
  const increaseSpeed = document.getElementById("increaseSpeed");
  const wordDisplay = document.getElementById("wordDisplay");
  const speedIndicator = document.getElementById("speedIndicator");

  /* -----------------------------
     SPEED + TIMING LOGIC
  ------------------------------ */

  function getIntervalDuration() {
    return 60000 / speed; // correct WPM math
  }

  function startInterval() {
    clearInterval(intervalId);
    intervalId = setInterval(displayNextWord, getIntervalDuration());
  }

  function stopInterval() {
    clearInterval(intervalId);
    intervalId = null;
  }

  function updateSpeedDisplay() {
    speedIndicator.textContent = speed + " wpm";
  }

  decreaseSpeed.addEventListener("click", () => {
    if (speed > 50) {
      speed -= 25;
      updateSpeedDisplay();
      if (intervalId) startInterval(); // live update
    }
  });

  increaseSpeed.addEventListener("click", () => {
    speed += 25;
    updateSpeedDisplay();
    if (intervalId) startInterval(); // live update
  });

  /* -----------------------------
     START READING
  ------------------------------ */

  startBtn.addEventListener("click", () => {
    const text = textInput.value.trim();
    if (!text) return;

    words = text.split(/\s+/);
    currentIndex = 0;

    displayNextWord();
    startInterval();
  });

  /* -----------------------------
     WORD LOOP
  ------------------------------ */

  function displayNextWord() {
    if (currentIndex >= words.length) {
      stopInterval();
      wordDisplay.innerHTML = "";
      wordDisplay.style.transform = "";
      return;
    }

    formatWord(words[currentIndex]);
    currentIndex++;
  }

  /* -----------------------------
     ORP (Optimal Recognition Point)
  ------------------------------ */

  function formatWord(word) {
    if (!word) return;

    wordDisplay.innerHTML = "";

    const pivotIndex = Math.max(
      0,
      Math.min(word.length - 1, Math.floor(word.length * 0.35))
    );

    const before = word.slice(0, pivotIndex);
    const pivot = word[pivotIndex];
    const after = word.slice(pivotIndex + 1);

    const beforeSpan = document.createElement("span");
    beforeSpan.textContent = before;

    const pivotSpan = document.createElement("span");
    pivotSpan.className = "red";
    pivotSpan.textContent = pivot;

    const afterSpan = document.createElement("span");
    afterSpan.textContent = after;

    wordDisplay.append(beforeSpan, pivotSpan, afterSpan);

    const offset =
      beforeSpan.getBoundingClientRect().width +
      pivotSpan.getBoundingClientRect().width / 2;

    wordDisplay.style.transform = `translateX(-${offset}px)`;
  }

  updateSpeedDisplay();
</script>

</body>
</html>
